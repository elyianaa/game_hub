<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Hub</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--mute:#7b8190;--line:#c9c6bd;--thick:#1f2430;--acc:#3a6ea5;--sel:#cfe2f7;--peer:#eaf1f8;--same:#f8e3a6;--err:#f4b6b6;--user:#2b5fa3;--beg:#3f8f5b;--int:#c77a1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1e222b;--ink:#e8eaf0;--mute:#8f96a6;--line:#3a4050;--thick:#aab2c5;--acc:#6fa4dd;--sel:#2c4666;--peer:#252c3a;--same:#5a4a1c;--err:#6b2b2b;--user:#8ab8ee;--beg:#5cc07f;--int:#e69a45}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1e222b;--ink:#e8eaf0;--mute:#8f96a6;--line:#3a4050;--thick:#aab2c5;--acc:#6fa4dd;--sel:#2c4666;--peer:#252c3a;--same:#5a4a1c;--err:#6b2b2b;--user:#8ab8ee;--beg:#5cc07f;--int:#e69a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.badge{padding:2px 8px;border-radius:10px;color:#fff;font-size:12px}
.b{background:var(--beg)}.i{background:var(--int)}
#board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;border:2px solid var(--thick);background:var(--card);user-select:none}
.c{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5.4vw,26px);border:1px solid var(--line);cursor:pointer;min-width:0}
.c:nth-child(9n+3),.c:nth-child(9n+6){border-right:2px solid var(--thick)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--thick)}
.c.p{background:var(--peer)}.c.s2{background:var(--same)}.c.sel{background:var(--sel)}.c.e{background:var(--err)}
.c.g{font-weight:700}.c.u{color:var(--user)}
.n{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(7px,2.2vw,11px);color:var(--mute);text-align:center;line-height:1.5}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}
.pad button,.act button{padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer}
.act{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.act button{font-size:13px}.act button.on{background:var(--acc);color:#fff}
.msg{min-height:22px;margin-top:8px;text-align:center;font-size:14px;color:var(--mute)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv button{padding:10px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font-size:14px}
.lv button.b{border-color:var(--beg);color:var(--ink);background:var(--card)}.lv button.i{border-color:var(--int);background:var(--card)}
.lv button.d{opacity:.55}.lv button.cur{outline:3px solid var(--acc)}
.legend{font-size:13px;color:var(--mute);margin-bottom:8px}
.flt{display:flex;gap:6px;margin-bottom:10px}
.flt button{padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer;font-size:13px}
.flt button.on{background:var(--acc);color:#fff}
.ans{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px}
.ac h4{margin:0 0 4px;font-size:12px;display:flex;justify-content:space-between}
.ac table{border-collapse:collapse;width:100%;table-layout:fixed;border:2px solid var(--thick)}
.ac td{border:1px solid var(--line);text-align:center;font-size:11px;padding:1px 0;color:var(--mute)}
.ac td.g{color:var(--ink);font-weight:700}
.ac td:nth-child(3n){border-right:2px solid var(--thick)}
.ac tr:nth-child(3n) td{border-bottom:2px solid var(--thick)}
.hide{display:none!important}

.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin-bottom:6px}
.h-sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.h-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.h-stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.h-stats b{font-size:26px}.h-stats span{font-size:12px;color:var(--mute)}
.h-card{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;padding:16px;border:0;border-radius:16px;color:#fff;text-align:left;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2))}
.h-ic{font-size:44px}.h-card strong{display:block;font-size:20px}.h-card em{display:block;font-style:normal;font-size:13px;opacity:.9;margin:2px 0 6px}
.h-card i{font-style:normal;font-size:12px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px}
.t-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.t-wrap{position:relative}
.t-board{position:relative;width:100%;aspect-ratio:6/7;container-type:inline-size;background:var(--peer);border-radius:14px;overflow:hidden}
.t-tile{position:absolute;width:16.667%;height:14.286%;padding:.6%;box-sizing:border-box;cursor:pointer}
.t-face{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;box-sizing:border-box;font-size:var(--fs,9cqw);line-height:1}
.t-tile.blk{pointer-events:none}.t-tile.blk .t-face{filter:brightness(.5)}
.t-tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;padding:6px;background:var(--peer);border:2px solid var(--thick);border-radius:12px;container-type:inline-size}
.t-slot{aspect-ratio:1;border-radius:8px;background:var(--bg);padding:2px;box-sizing:border-box}
.t-tray .t-face{font-size:8cqw}
.t-face.pop{animation:tp .25s forwards}@keyframes tp{to{transform:scale(0);opacity:0}}
.t-pw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.t-pw button,.t-ov button{padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:13px;cursor:pointer}
.t-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);color:#fff;font-size:22px;font-weight:700;text-align:center;z-index:99;border-radius:14px}
.t-ov button{font-size:16px;padding:10px 20px;background:var(--acc);color:#fff;border-color:var(--acc)}
</style></head>
<body>
<main id="home" class="view">
<h1>🎮 Game Hub</h1><p class="h-sub">Pick a game. Your progress is saved on this device.</p>
<div class="h-stats"><div><b id="hs1">0</b><span>Sudoku levels solved</span></div><div><b id="hs2">1</b><span>Tile Match level</span></div></div>
<button class="h-card" data-go="sudoku" style="--g1:#3a6ea5;--g2:#5fa0d6"><span class="h-ic">🧩</span><span><strong>Sudoku</strong><em>100 levels · Beginner &amp; Intermediate · answer sheets</em><i id="hp1">0 / 100 solved</i></span></button>
<button class="h-card" data-go="tile" style="--g1:#d2553d;--g2:#f0955a"><span class="h-ic">🍓</span><span><strong>Tile Match</strong><em>Tap tiles, match 3 in the tray, clear the pile</em><i id="hp2">Level 1</i></span></button>
</main>
<main id="sudoku" class="view hide"><button class="back" data-go="home">← Games</button>
<h1>🧩 Sudoku · 100 Levels</h1>
<div class="tabs"><button data-t="play" class="on">Play</button><button data-t="levels">Levels</button><button data-t="answers">Answers</button></div>

<section id="play">
 <div class="bar"><span>Level <b id="lvn">1</b> <span id="lvb" class="badge b">Beginner</span></span><span id="tm">0:00</span></div>
 <div id="board"></div>
 <div class="pad" id="pad"></div>
 <div class="act"><button id="note">✏️ Notes</button><button id="er">Erase</button><button id="hint">💡 Hint</button><button id="nx">Next ▶</button></div>
 <div class="msg" id="msg"></div>
</section>

<section id="levels" class="hide"><div class="legend"><span style="color:var(--beg)">■</span> Beginner &nbsp; <span style="color:var(--int)">■</span> Intermediate &nbsp; ✓ = solved</div><div class="lv" id="lv"></div></section>

<section id="answers" class="hide"><div class="flt" id="flt"><button data-f="all" class="on">All</button><button data-f="b">Beginner</button><button data-f="i">Intermediate</button></div><div class="ans" id="ans"></div><div class="msg" id="ansmsg"></div></section>
</main>
<main id="tile" class="view hide"><button class="back" data-go="home">← Games</button>
<div class="t-top"><span>Level <b id="t_lvl">1</b></span><span id="t_left"></span></div>
<div class="t-wrap"><div class="t-board" id="t_board"></div><div class="t-ov hide" id="t_ov"><div id="t_ovt"></div><button id="t_ovb"></button></div></div>
<div class="t-tray" id="t_tray"></div>
<div class="t-pw"><button id="t_undo"></button><button id="t_shuf"></button><button id="t_out"></button><button id="t_rst">🔄 Restart</button></div>
</main>
<script>
const N=100;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const isBeg=l=>l%5<3; // levels 1-3 beginner, 4-5 intermediate, repeating -> 60 / 40
const units=[];for(let k=0;k<9;k++){const r=[],c=[],b=[];for(let j=0;j<9;j++){r.push(k*9+j);c.push(j*9+k);b.push(((k/3|0)*3+(j/3|0))*9+(k%3)*3+j%3)}units.push(r,c,b)}
function cand(g,i){let m=0;const r=i/9|0,c=i%9;for(let k=0;k<9;k++){m|=1<<g[r*9+k];m|=1<<g[k*9+c]}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)m|=1<<g[(br+a)*9+bc+b];return 511&~(m>>1)}
const pc=m=>{let n=0;while(m){m&=m-1;n++}return n};
function count(g,lim){let bi=-1,bm=0,bn=10;for(let i=0;i<81;i++)if(!g[i]){const m=cand(g,i),n=pc(m);if(n<bn){bn=n;bi=i;bm=m;if(n<2)break}}
 if(bi<0)return 1;let t=0;for(let d=0;d<9;d++)if(bm>>d&1){g[bi]=d+1;t+=count(g,lim-t);g[bi]=0;if(t>=lim)break}return t}
function singles(p){const g=p.slice();let go=true;while(go){go=false;
 for(let i=0;i<81;i++)if(!g[i]){const m=cand(g,i);if(pc(m)===1){g[i]=Math.log2(m)+1;go=true}}
 for(const u of units)for(let d=1;d<=9;d++){let f=-1,n=0;for(const i of u){if(g[i]===d){n=9;break}if(!g[i]&&cand(g,i)>>(d-1)&1){n++;f=i}}if(n===1){g[f]=d;go=true}}}
 return g.every(x=>x)}
const cache={};
function gen(l){if(cache[l])return cache[l];const r=rng(l*7919+13),beg=isBeg(l);
 const bands=()=>shuf([0,1,2],r).flatMap(b=>shuf([0,1,2],r).map(x=>b*3+x));
 const R=bands(),C=bands(),D=shuf([1,2,3,4,5,6,7,8,9],r),s=[];
 for(let i=0;i<9;i++)for(let j=0;j<9;j++)s.push(D[(3*(R[i]%3)+(R[i]/3|0)+C[j])%9]);
 const g=s.slice(),order=shuf([...Array(81).keys()],r),target=beg?36+(r()*5|0):29+(r()*4|0);let givens=81;
 for(const i of order){if(givens<=target)break;const v=g[i];g[i]=0;if(count(g.slice(),2)!==1||(beg&&!singles(g)))g[i]=v;else givens--}
 return cache[l]={p:g,s,beg}}

const $=id=>document.getElementById(id);
let lv=1,u,notes,sel=-1,noteMode=false,t0=0,tick,won=false,hints=0,save={};
try{save=JSON.parse(localStorage.getItem('sdk100')||'{}')}catch(e){}
const persist=()=>{try{localStorage.setItem('sdk100',JSON.stringify(save))}catch(e){}};
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');

function load(l){lv=l;const q=gen(l);u=q.p.slice();notes=Array(81).fill(0);sel=-1;won=false;hints=0;$('msg').textContent='';
 $('lvn').textContent=l;const b=$('lvb');b.textContent=q.beg?'Beginner':'Intermediate';b.className='badge '+(q.beg?'b':'i');
 t0=Date.now();clearInterval(tick);tick=setInterval(()=>{if(!won)$('tm').textContent=fmt((Date.now()-t0)/1000|0)},500);$('tm').textContent='0:00';draw();showTab('play')}

function errs(){const e=new Set;for(const un of units){const seen={};for(const i of un){const v=u[i];if(!v)continue;(seen[v]=seen[v]||[]).push(i)}for(const k in seen)if(seen[k].length>1)seen[k].forEach(i=>e.add(i))}return e}
function draw(){const q=gen(lv),e=errs(),B=$('board');B.innerHTML='';const sv=sel>=0?u[sel]:0;
 for(let i=0;i<81;i++){const d=document.createElement('div');let c='c';
  if(q.p[i])c+=' g';else if(u[i])c+=' u';
  if(sel>=0){const r=i/9|0,cc=i%9,sr=sel/9|0,sc=sel%9;if(i===sel)c+=' sel';else if(sv&&u[i]===sv)c+=' s2';else if(r===sr||cc===sc||((r/3|0)===(sr/3|0)&&(cc/3|0)===(sc/3|0)))c+=' p'}
  if(e.has(i)&&!q.p[i])c+=' e';d.className=c;
  if(u[i])d.textContent=u[i];else if(notes[i]){let h='<div class="n">';for(let k=0;k<9;k++)h+='<span>'+(notes[i]>>k&1?k+1:'')+'</span>';d.innerHTML=h+'</div>'}
  d.onclick=()=>{sel=i;draw()};B.appendChild(d)}
 checkWin()}
function checkWin(){if(won||u.some(x=>!x))return;const q=gen(lv);if(u.every((x,i)=>x===q.s[i])){won=true;const t=(Date.now()-t0)/1000|0;
  if(!save[lv]||t<save[lv])save[lv]=t;persist();$('msg').textContent='🎉 Solved in '+fmt(t)+(hints?' with '+hints+' hint(s)':'')+'!';buildLevels()}}
function put(v){if(sel<0||won)return;const q=gen(lv);if(q.p[sel])return;
 if(noteMode&&v){if(u[sel])return;notes[sel]^=1<<(v-1)}else{u[sel]=v;notes[sel]=0;
  if(v)for(const un of units)if(un.includes(sel))for(const i of un)if(!q.p[i])notes[i]&=~(1<<(v-1))}
 draw()}
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>'<button>'+n+'</button>').join('');
[...$('pad').children].forEach((b,i)=>b.onclick=()=>put(i+1));
$('er').onclick=()=>put(0);
$('note').onclick=e=>{noteMode=!noteMode;e.target.classList.toggle('on',noteMode)};
$('hint').onclick=()=>{if(won)return;const q=gen(lv);let i=sel;if(i<0||q.p[i]||u[i]===q.s[i]){const w=[];for(let k=0;k<81;k++)if(u[k]!==q.s[k])w.push(k);if(!w.length)return;i=w[0]}
 sel=i;u[i]=q.s[i];notes[i]=0;hints++;draw()};
$('nx').onclick=()=>load(lv%N+1);
document.addEventListener('keydown',e=>{if($('sudoku').classList.contains('hide')||$('play').classList.contains('hide'))return;
 if(e.key>='1'&&e.key<='9')put(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0);
 else if(sel>=0){const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];if(m){const n=sel+m;if(n>=0&&n<81&&!(m===-1&&sel%9===0)&&!(m===1&&sel%9===8)){sel=n;draw()}e.preventDefault()}}});

function buildLevels(){const L=$('lv');L.innerHTML='';for(let l=1;l<=N;l++){const b=document.createElement('button');b.className=(isBeg(l)?'b':'i')+(save[l]?' d':'')+(l===lv?' cur':'');b.textContent=l+(save[l]?' ✓':'');b.onclick=()=>load(l);L.appendChild(b)}}

let af='all',built=0;
function card(l){const q=gen(l),d=document.createElement('div');d.className='ac';d.dataset.b=q.beg?'b':'i';
 let h='<h4><span>Level '+l+'</span><span style="color:var(--'+(q.beg?'beg':'int')+')">'+(q.beg?'Beginner':'Intermediate')+'</span></h4><table>';
 for(let r=0;r<9;r++){h+='<tr>';for(let c=0;c<9;c++){const i=r*9+c;h+='<td'+(q.p[i]?' class="g"':'')+'>'+q.s[i]+'</td>'}h+='</tr>'}
 d.innerHTML=h+'</table>';return d}
function buildAnswers(){if(built>=N)return;$('ansmsg').textContent='Preparing answer sheets… '+built+'/'+N;
 const end=Math.min(N,built+10);for(let l=built+1;l<=end;l++)$('ans').appendChild(card(l));built=end;applyF();
 if(built<N)setTimeout(buildAnswers,10);else $('ansmsg').textContent='Bold digits = given clues; light digits = the solution you fill in.'}
function applyF(){[...$('ans').children].forEach(c=>c.classList.toggle('hide',af!=='all'&&c.dataset.b!==af))}
$('flt').onclick=e=>{const f=e.target.dataset.f;if(!f)return;af=f;[...$('flt').children].forEach(b=>b.classList.toggle('on',b===e.target));applyF()};

function showTab(t){['play','levels','answers'].forEach(k=>$(k).classList.toggle('hide',k!==t));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='levels')buildLevels();if(t==='answers')buildAnswers()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));

const first=[...Array(N).keys()].map(i=>i+1).find(l=>!save[l])||1;
load(first);
</script>
<script>
(()=>{
const $=id=>document.getElementById(id),E=['🍎','🍌','🍇','🍓','🍒','🥕','🌽','🍉','🍑','🥝','🍋','🍍'];
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let sv={lvl:1};try{sv=Object.assign(sv,JSON.parse(localStorage.getItem('tile1')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('tile1',JSON.stringify(sv))}catch(e){}};
let C=6,lvl=sv.lvl,T=[],tray=[],hist=[],pw={},busy=false,over=false;
const blocked=t=>T.some(o=>o.s==='b'&&o.l>t.l&&Math.abs(o.x-t.x)<1&&Math.abs(o.y-t.y)<1);
const AN=[[1,21],[10,60],[20,90],[30,150],[40,210],[50,300]];
function size(n){if(n>50)return 450;let i=0;while(n>AN[i+1][0])i++;const[l0,t0]=AN[i],[l1,t1]=AN[i+1];return Math.round((t0+(t1-t0)*(n-l0)/(l1-l0))/3)*3}
function start(n){try{begin(n)}catch(err){$('t_board').textContent='Tile Match error: '+err.message;console.error(err)}}
function begin(n){lvl=n;over=false;busy=false;tray=[];hist=[];pw={u:2,s:1,o:1};$('t_ov').classList.add('hide');
 const r=rng(n*104729+7),total=size(n),tri=total/3,kinds=Math.min(12,3+Math.ceil(n*.9));C=total<=90?6:total<=150?7:total<=210?8:total<=300?9:10;const L=Math.max(2,Math.ceil(total/(.55*C*C)));
 const ks=[];for(let i=0;i<tri;i++)ks.push(i%kinds);const pool=shuf([...ks,...ks,...ks],r);
 T=[];let left=total;
 for(let l=0;l<L;l++){const o=l%2,cells=[],nc=o?C-1:C,nr=o?C:C+1;
  for(let c=0;c<nc;c++)for(let q=0;q<nr;q++)cells.push([c+o*.5,q+o*.5]);shuf(cells,r);
  const cnt=l===L-1?left:Math.min(left,Math.ceil(total/L));
  for(let k=0;k<cnt;k++)T.push({x:cells[k][0],y:cells[k][1],l,k:0,s:'b'});left-=cnt}
 T.forEach((t,i)=>t.k=pool[i]);const B=$('t_board');B.style.aspectRatio=C+'/'+(C+1);B.style.setProperty('--fs',(54/C).toFixed(2)+'cqw');render()}
function render(){
 $('t_board').innerHTML=T.filter(t=>t.s==='b').sort((a,b)=>a.l-b.l).map(t=>`<div class="t-tile${blocked(t)?' blk':''}" data-i="${T.indexOf(t)}" style="left:${t.x/C*100}%;top:${t.y/(C+1)*100}%;width:${100/C}%;height:${100/(C+1)}%;z-index:${t.l+1}"><div class="t-face">${E[t.k]}</div></div>`).join('');
 $('t_tray').innerHTML=Array.from({length:7},(_,i)=>{const t=tray[i];return `<div class="t-slot">${t?`<div class="t-face${t.pop?' pop':''}">${E[t.k]}</div>`:''}</div>`}).join('');
 $('t_lvl').textContent=lvl;$('t_left').textContent=(T.filter(t=>t.s==='b').length+tray.length)+' tiles left';
 $('t_undo').textContent='↩ Undo ('+pw.u+')';$('t_shuf').textContent='🔀 Shuffle ('+pw.s+')';$('t_out').textContent='📤 Move out ('+pw.o+')'}
function end(win){over=true;$('t_ovt').textContent=win?'🎉 Level '+lvl+' cleared!':'😵 Tray is full!';
 const b=$('t_ovb');b.textContent=win?'Next level ▶':'Try again';b.onclick=()=>start(win?lvl+1:lvl);$('t_ov').classList.remove('hide');
 if(win){sv.lvl=Math.max(sv.lvl,lvl+1);persist()}}
$('t_board').onclick=e=>{const el=e.target.closest('.t-tile');if(!el||over||busy)return;const t=T[+el.dataset.i];
 if(blocked(t)||tray.length>=7)return;
 t.s='t';hist.push(t);const p=tray.map(x=>x.k).lastIndexOf(t.k);p<0?tray.push(t):tray.splice(p+1,0,t);
 const m=tray.filter(x=>x.k===t.k).slice(0,3);
 if(m.length===3){busy=true;m.forEach(x=>x.pop=1);render();
  setTimeout(()=>{m.forEach(x=>x.s='x');tray=tray.filter(x=>x.s==='t');busy=false;render();
   if(!T.some(x=>x.s!=='x'))end(true)},260)}
 else{render();if(tray.length>=7)end(false)}};
$('t_undo').onclick=()=>{if(over||busy||!pw.u)return;while(hist.length&&hist[hist.length-1].s!=='t')hist.pop();
 const t=hist.pop();if(!t)return;tray.splice(tray.indexOf(t),1);t.s='b';pw.u--;render()};
$('t_shuf').onclick=()=>{if(over||busy||!pw.s)return;const b=T.filter(t=>t.s==='b'),k=shuf(b.map(t=>t.k),Math.random);b.forEach((t,i)=>t.k=k[i]);pw.s--;render()};
$('t_out').onclick=()=>{if(over||busy||!pw.o||!tray.length)return;tray.splice(0,3).forEach(t=>t.s='b');pw.o--;render()};
$('t_rst').onclick=()=>start(lvl);
window.tileStart=()=>{if(over)start(lvl)};
start(lvl);
})();
(()=>{
const $=id=>document.getElementById(id),V=['home','sudoku','tile'];
function stats(){let s={},t={};try{s=JSON.parse(localStorage.getItem('sdk100')||'{}')}catch(e){}try{t=JSON.parse(localStorage.getItem('tile1')||'{}')}catch(e){}
 const n=Object.keys(s).length,l=t.lvl||1;$('hs1').textContent=n;$('hs2').textContent=l;$('hp1').textContent=n+' / 100 solved';$('hp2').textContent='Level '+l}
function go(v){V.forEach(k=>$(k).classList.toggle('hide',k!==v));window.scrollTo(0,0);if(v==='home')stats()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
stats();
})();
